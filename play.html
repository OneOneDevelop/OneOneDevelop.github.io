<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Bloom</title>
<meta property="og:title" content="A Pixel Bloom puzzle for you">
<meta property="og:description" content="Tap to play. Relaxing pixel art puzzles, no timer.">
<style>
  body { font: 18px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; color: #2b2b2b;
         background: #fbf7f0; margin: 0; padding: 48px 20px; text-align: center; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  a.button { display: inline-block; margin: 10px 6px; padding: 14px 26px; border-radius: 28px;
             background: #1f2a44; color: #fff; text-decoration: none; font-weight: 700; }
  a.button.secondary { background: #ede7db; color: #2b2b2b; }
  code { display: block; margin: 16px auto; max-width: 520px; padding: 12px; border-radius: 10px;
         background: #ede7db; word-break: break-all; font-size: 13px; }
  .muted { color: #7a7264; font-size: 15px; }
</style>
</head>
<body>
<h1>Pixel Bloom</h1>
<p id="what">A friend sent you a puzzle.</p>
<p><a class="button" id="open" href="#">Open in Pixel Bloom</a></p>
<p class="muted">Don't have the game yet?</p>
<p>
  <!-- Replace with the real store pages once the game is published. -->
  <a class="button secondary" id="ios" href="#">App Store</a>
  <a class="button secondary" id="android" href="#">Google Play</a>
</p>
<div id="manual" hidden>
  <p class="muted">Or copy this code and paste it under Photo puzzle in the game:</p>
  <code id="code"></code>
</div>
<script>
  // The app registers the pixelbloom:// scheme; this page only forwards the
  // query string to it, so nothing is stored or sent anywhere.
  var query = window.location.search;
  var params = new URLSearchParams(query);
  var deep = 'pixelbloom://play' + query;
  document.getElementById('open').href = deep;
  if (params.get('c')) {
    document.getElementById('manual').hidden = false;
    document.getElementById('code').textContent = 'PB1.' + params.get('c');
  } else if (params.get('d')) {
    document.getElementById('what').textContent =
      'A friend finished today\'s picture in ' + params.get('m') + ' moves. Can you beat that?';
  }
  if (query) window.location.href = deep;
</script>
</body>
</html>
